<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up - Kerei Laundry</title>
  <style>
    body { font-family: Arial; background: #f9f9f9; }
    .container {
      width: 400px; margin: 40px auto; padding: 20px;
      background: #fff; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; }
    label { display: block; margin-top: 10px; }
    input, textarea {
      width: 100%; padding: 8px; margin-top: 5px;
      border: 1px solid #ccc; border-radius: 4px;
    }
    button {
      margin-top: 15px; padding: 10px; width: 100%;
      background: #28a745; color: white; border: none; border-radius: 4px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>User Sign Up</h2>
    <form action="signup_user.php" method="POST">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="text" name="phone_number">

      <label>Address</label>
      <textarea name="address"></textarea>

      <label>Password</label>
      <input type="password" name="password" required>

      <button type="submit">Sign Up</button>
    </form>
    <p style="text-align:center;">Already have an account? <a href="login_user.html">Login</a></p>
  </div>
</body>
</html>
